name: LobsterDeck
options:
  bundleIdPrefix: com.liguiyu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  LobsterDeck:
    type: application
    platform: iOS
    sources:
      - path: LobsterDeck
    info:
      path: LobsterDeck/Info.plist
      properties:
        CFBundleDisplayName: 龙虾驾驶舱
        CFBundleShortVersionString: "1.0"
        # Bumped for the top-bar transparency + commit-detail wrap toggle
        # + home tile layout so the new IPA is distinguishable from
        # 1.0 (2): Settings shows "1.0 (3)". Without a bump, installers
        # treat all builds as the same version and the user cannot tell
        # old from new.
        CFBundleVersion: "3"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liguiyu.lobsterdeck
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
schemes:
  LobsterDeck:
    build:
      targets:
        LobsterDeck: all
    run:
      config: Debug
    archive:
      config: Release
